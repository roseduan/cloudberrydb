# PG Iceberg REST Gateway — sample configuration.
# All keys can be overridden by environment variables (see GatewayConfig).

# --- HTTP server ---
server.port=8181

# --- HTTPS (default ON — client_secret == PG password, issue #382 production readiness).
#     With no keystore configured the gateway lazily auto-generates a throwaway self-signed
#     PKCS12 cert (CN=localhost) and logs a loud WARNING — fine for dev/local, NOT for
#     production. Configure server.https.keystore.path with a real certificate for production,
#     or set server.https.required=true to fail closed instead of falling back to the
#     self-signed cert. Set server.https.enabled=false to opt back into plaintext (e.g. behind
#     a TLS-terminating proxy). ---
server.https.enabled=true
server.https.port=8443
server.https.keystore.path=
server.https.keystore.password=
server.https.required=false

# --- PostgreSQL (authenticator role owns the pool and the DB session for every request;
#     since issue #382 item B the gateway does NOT SET ROLE — it calls the SECURITY DEFINER
#     pg_ext_aux.iceberg_visible_tables(p_role) accessor with the end-user's role instead) ---
pg.jdbcUrl=jdbc:postgresql://localhost:7000/postgres?ssl=false
# PROD: dedicated NOINHERIT NOSUPERUSER authenticator (see security/create_authenticator.sql).
# The gateway REFUSES to start (AuthPreflight) if this role is superuser or if a wrong password
# still connects (trust HBA). NEVER set this to gpadmin in a shared/prod deployment.
pg.authenticator.user=iceberg_authenticator
# Inject the password at runtime via env PG_AUTHENTICATOR_PASSWORD; leave empty here.
pg.authenticator.password=
pg.pool.maxSize=10

# --- OAuth token endpoint rate limiting (issue #382 C2 Task 3): slows password brute-forcing
#     by rejecting (429 + Retry-After) once a client_id+remote-address pair has made
#     maxAttempts requests within the trailing windowSeconds. Failed attempts count too. ---
oauth.rateLimit.maxAttempts=20
oauth.rateLimit.windowSeconds=60
# Hard bound on the number of distinct client_id+remote-address keys tracked at once (issue #382
# C2 review finding): client_id is attacker-supplied and unvalidated, so without this bound a
# single IP cycling through bogus client_ids could grow the tracking map without bound (a
# memory-exhaustion DoS in the very feature meant to prevent DoS). Least-recently-used keys are
# evicted once this many distinct keys are tracked, regardless of window expiry.
# Accepted tradeoff: eviction is by access-recency, not window state, so an attacker churning
# more than this many distinct client_ids can evict (reset) an actively-limited key; at the
# default below that requires ~100,000 distinct-key requests to force one eviction.
oauth.rateLimit.maxKeys=100000

# --- Object storage (client-side hints only; the gateway itself reads no object storage) ---
# The gateway holds no credentials: metadata.json comes from the database and data files are
# read by the client. Only this non-secret boolean is advertised via /v1/config so clients
# know how to address the bucket; endpoint/keys/region deliberately no longer exist here.
s3.path-style-access=true

# --- Metadata document cache ---
# metadata.json is immutable at a given location (an Iceberg commit writes a new file and moves
# the pointer), so caching by location can never serve a stale document -- a commit invalidates
# it implicitly. Every request still does the per-role pointer lookup through
# iceberg_visible_tables, so authorization is never cached. This exists because a REST client
# calls loadTable on essentially every query, and each miss costs the coordinator one dlagent
# round trip plus one object storage GET. Set maxEntries=0 to disable.
catalog.metadataCache.maxEntries=128
# Documents above this size are served but not retained (runaway snapshot history, not big data).
catalog.metadataCache.maxDocBytes=1048576

# --- JWT (short-lived, self-signed) ---
jwt.ttlSeconds=900
jwt.issuer=pg-iceberg-rest-gateway
# Base64-encoded HMAC secret. PRODUCTION MUST configure this: >=32 bytes (256 bit) base64,
# e.g. `openssl rand -base64 32`. Rotate by changing the value + restarting the gateway;
# outstanding tokens signed with the old secret simply expire within jwt.ttlSeconds (no hot
# key rotation / kid / keyset support in this batch). Empty = ephemeral key generated on boot
# (dev only — all outstanding tokens are invalidated on every restart).
jwt.hmacSecretBase64=
# Fail-closed startup gate (issue #382 C2 decision J1): if true, AuthPreflight refuses to start
# when jwt.hmacSecretBase64 is empty instead of falling back to an ephemeral key. Default false
# to keep local/dev bring-up frictionless; set true for production.
jwt.requireConfiguredSecret=false
