nn:
  hdfs_namenodes: namenode.example.com
  hdfs_port: 8020
  hdfs_auth_method: simple
  username: gpadmin

spliced:
  hdfs_namenodes: namenode.example.com:9000
  hdfs_port: 8020

noport:
  hdfs_namenodes: namenode.example.com

ha:
  hdfs_namenodes: mycluster
  is_ha_supported: true
  dfs_nameservices: mycluster
  dfs_ha_namenodes: nn1,nn2
  dfs_namenode_rpc_address: nn1.example.com:8020
  dfs_client_failover_proxy_provider: org.apache.hadoop.hdfs.server.namenode.ha.ConfiguredFailoverProxyProvider
  dfs_client_use_datanode_hostname: yes

dtp:
  hdfs_namenodes: namenode.example.com
  data_transfer_protocol: true
  data_transfer_protection: privacy

kerberos:
  hdfs_namenodes: namenode.example.com
  hdfs_auth_method: kerberos
  krb_principal: gpadmin@EXAMPLE.COM
  krb_principal_keytab: /etc/security/gpadmin.keytab
  hadoop_rpc_protection: privacy
  krb_service_principal: nn/_HOST@EXAMPLE.COM

legacy_dotted:
  hdfs_namenodes: namenode.example.com
  dfs.nameservices: mycluster

legacy_prefix:
  hdfs_namenode_host: namenode.example.com
  dfs.client.failover.proxy.provider: org.apache.hadoop.Whatever
  dfs.something.else: x
