  fs.s3a.some.other.key: x
  fs.gopher.whatever: y

floaty:
  type: s3
  endpoint: 1.50

# The three float spellings the older PyYAML-style pattern would leave as
# strings and snakeyaml 2.2 resolves as floats: an exponent with no point, a
# signed leading point, and a leading point with an unsigned exponent.  They
# are here because a reader working from the older pattern reads the C
# resolver as over-matching and "narrows" it -- at which point the agent
# sends 1000.0 and the database sends 1e3, and nothing notices.
expo:
  type: s3
  endpoint: 1e3

signdot:
  type: s3
  endpoint: +.5

dotexp:
  type: s3
  endpoint: .5e5

stamp:
  type: s3
  endpoint: 2020-01-01

sexa:
  type: s3
  endpoint: 1:30

nested:
  type: s3
  endpoint:
    host: minio
    port: 9000

badkey:
  type: s3
  on: surprise
