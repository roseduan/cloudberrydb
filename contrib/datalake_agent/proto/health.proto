// It is checked in for two reasons: the C++ side generates its client from it,
// and dlagent-grpc's hand-written Health service is pinned against golden
// bytes produced by running protoc on THIS file, so the copy the Java server
// implements and the copy the C++ client speaks are provably the same one.
