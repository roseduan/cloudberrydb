default:
  interruptible: true

stages:
  - build
  - test
  - coverage
  - .post

workflow:
  auto_cancel:
    on_new_commit: interruptible

variables:
  ARTIFACTORY_USERNAME: "admin"
  ARTIFACTORY_PASSWORD: "token"
  GIT_STRATEGY: "empty"
  DEVEL_IMAGE: "docker.hashdata.dev/hashdata-releng/centos-7:devel-cbdb-20260319"

.common-cache: &cache-only-pull
  cache:
    - key: cache-${CI_PROJECT_ID}-${ARCH}
      paths:
        - .cache/
      when: always
      policy: pull
    - key: cache-pipeline-build-${ARCH}-${CI_PIPELINE_ID}
      unprotect: true
      paths:
        - ${CI_PROJECT_DIR}/build
        - ${CI_PROJECT_DIR}/scripts
        - ${CI_PROJECT_DIR}/Makefile
        - ${CI_PROJECT_DIR}/dist/database
      when: 'on_success'
      policy: pull
    - key: cache-pipeline-database-${ARCH}-${CI_PIPELINE_ID}
      unprotect: true
      paths:
        - ${CI_PROJECT_DIR}/database
        - ${CI_PROJECT_DIR}/services
      when: 'on_success'
      policy: pull

.common:
  parallel:
    matrix:
      - ARCH:
          - aarch64
          - x86_64
  tags:
    - docker
    - ${ARCH}
    - 8c32g
  variables:
    GIT_SUBMODULE_STRATEGY: "normal"
    GIT_DEPTH: 1
    DATABASE_CONFIG_EXTRA_OPTIONS: "--enable-coverage"
  cache:
    - key: cache-${CI_PROJECT_ID}-${ARCH}
      paths:
        - .cache/
      when: always
    - key: cache-pipeline-build-${ARCH}-${CI_PIPELINE_ID}
      unprotect: true
      paths:
        - ${CI_PROJECT_DIR}/build
        - ${CI_PROJECT_DIR}/scripts
        - ${CI_PROJECT_DIR}/Makefile
        - ${CI_PROJECT_DIR}/dist/database
      when: 'always'
    - key: cache-pipeline-database-${ARCH}-${CI_PIPELINE_ID}
      unprotect: true
      paths:
        - ${CI_PROJECT_DIR}/database
        - ${CI_PROJECT_DIR}/services
      when: 'always'


.artifacts: &artifacts
  name: "hashdata-lightning"
  paths:
    - ${CI_PROJECT_DIR}/dist/packages/manifest*.txt
    - ${CI_PROJECT_DIR}/**/*regression*.out
    - ${CI_PROJECT_DIR}/**/*regression*.diffs
    - ${CI_PROJECT_DIR}/**/results/*
    - ${CI_PROJECT_DIR}/build/test/out/
    - ${CI_PROJECT_DIR}/build/test/failure/
    - ${CI_PROJECT_DIR}/build/pax_gtest/
    - ${CI_PROJECT_DIR}/build/test/postgis/*diff
    - ${CI_PROJECT_DIR}/**/gpMgmt/**/*.out
    - ${CI_PROJECT_DIR}/**/gpMgmt/**/*.diff
    - ${CI_PROJECT_DIR}/deploy/**/*.log
    - ${CI_PROJECT_DIR}/deploy/**/*.csv
    - ${CI_PROJECT_DIR}/analyze_cores/*.log
    - ${CI_PROJECT_DIR}/build/coverage/*.info

  when: always
  reports:
    dotenv: ${CI_PROJECT_DIR}/dist/packages/manifest*.txt
  expire_in: 1 week


.build-rules:
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    when: always
  - if: '$CI_DEFAULT_BRANCH == $CI_COMMIT_REF_NAME'
    when: always
    interruptible: false
  - when: manual

.common-rules:
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    when: on_success
  - if: '$CI_DEFAULT_BRANCH == $CI_COMMIT_REF_NAME'
    when: on_success
    interruptible: false
  - when: manual

.coverage-capture:
  before_script:
    - chmod -R a+w database/ 2>/dev/null || true
  after_script:
    - set -x
    - 'IMAGE=${DEVEL_IMAGE} ARCH=${ARCH} database/coverage.sh capture -o build/coverage/${CI_JOB_ID}-${ARCH}.info || echo "WARNING: coverage capture failed"'
    - ls -la build/coverage/ || true

code_review:
  stage: build
  allow_failure: true
  tags:
    - docker
    - x86_64
  image: docker.hashdata.dev/hashdata-releng/rockylinux-9:devel-cbdb-20260304
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
    GITLAB_HOST: ${CI_SERVER_FQDN}
  script:
    - bash code-review.sh
  artifacts:
    paths:
      - review/
    when: always
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always

build_develop:
  stage: build
  extends: .common
  script: |
    trap 'test -e /tmp/.debugging && tmux new-session -d -s debug && tmux wait-for done' EXIT

    env
    set -euxo pipefail

    git config --global --add safe.directory ${CI_PROJECT_DIR}
    git config --global init.defaultBranch none
    git config --global fetch.recurseSubmodules false
    git config --global credential.interactive never
    git config --global transfer.bundleURI true
    git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@code.hashdata.xyz".insteadOf "https://code.hashdata.xyz"

    git init ${CI_PROJECT_DIR}
    cd ${CI_PROJECT_DIR}

    # download umbrella repository
    git remote add origin https://code.hashdata.xyz/cloudberry/database/hashdata-lightning-umbrella.git
    git fetch origin --no-recurse-submodules --depth ${GIT_DEPTH}  --prune --quiet
    git checkout -f main

    rm -rf ${CI_PROJECT_DIR}/database

    # download database repository
    git clone -b ${CI_COMMIT_REF_NAME} --depth ${GIT_DEPTH} ${CI_REPOSITORY_URL} database
    cd ${CI_PROJECT_DIR}/database
    git -c 'submodule.recurse=false' checkout -f -q ${CI_COMMIT_SHA}
    # git lfs pull

    # download submodules
    git submodule init
    git submodule sync
    git submodule update --init --depth ${GIT_DEPTH}
    # git submodule foreach 'git lfs pull'

    chown -R gpadmin:gpadmin ${CI_PROJECT_DIR}
    cd ${CI_PROJECT_DIR}

    export ENV=devel

    echo "download dependencies"
    make build-depends
    echo "build database kernel"
    make build-database
    make package-prepare
  rules:
    - !reference [ .build-rules ]

test_database:
  stage: test
  extends:
    - .common
    - .coverage-capture
  <<: *cache-only-pull
  script: |
    trap 'test -e /tmp/.debugging && tmux new-session -d -s debug && tmux wait-for done' EXIT

    env
    set -euxo pipefail

    export ENV=devel
    export MAKE_TEST_COMMAND="-s -k PGOPTIONS='-c optimizer=off' installcheck"
    # Inject time_series into umbrella's test targets (auto-preload handled by Makefile)
    sed -i 's|contrib/uuid-ossp"|contrib/uuid-ossp contrib/time_series"|' scripts/functions/unit-test-function.sh
    make test-database
  rules:
    - !reference [ .common-rules ]
  artifacts:
    <<: *artifacts

