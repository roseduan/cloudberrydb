test_datalake_smoke:
  stage: test
  extends: .common
  <<: *cache-only-pull
  script: |
    trap 'test -e /tmp/.debugging && tmux new-session -d -s debug && tmux wait-for done' EXIT

    set -euxo pipefail

    pushd ${CI_PROJECT_DIR}
      docker network create share-enterprise-ci || true
      docker compose -f services/datalake-test-env.yml up -d
      docker cp database/contrib/datalake_fdw/automation/prepare/prepare_hive/hive_iceberg_fdw.sql spark-master:/tmp/
      docker cp database/contrib/datalake_fdw/automation/prepare/prepare_hive/hive_smoke.sql hiveserver2:/tmp/
      docker cp database/contrib/datalake_fdw/automation/prepare/prepare_hdfs/hdfs_smoke.sql hiveserver2:/tmp/
      # Hudi prep must run the same hudi version the datalake_fdw reader and
      # the committed expected files are calibrated against (0.13.1).  The
      # spark image ships hudi-spark3.3-bundle 0.14.1, whose shaded hbase is
      # ABI-incompatible with the image's hadoop-client 3.3.2: writes crash at
      # commit time with NoSuchMethodError: HdfsDataInputStream
      # .getReadStatistics() while closing metadata-table HFile readers
      # (pipeline #139668).  Swap the bundle inside the freshly composed
      # container before running any hudi SQL.
      HUDI_BUNDLE=hudi-spark3.3-bundle_2.12-0.13.1.jar
      curl -fsSL -o /tmp/${HUDI_BUNDLE} "https://hashdata-download.obs.cn-north-4.myhuaweicloud.com/lightning-ci/packages/${HUDI_BUNDLE}"
      docker exec spark-master bash -c 'rm -f /opt/spark/jars/hudi-spark3*-bundle_*.jar'
      docker cp /tmp/${HUDI_BUNDLE} spark-master:/opt/spark/jars/${HUDI_BUNDLE}

      docker cp database/contrib/datalake_fdw/automation/prepare/prepare_hudi/hudi_smoke.sql spark-master:/tmp/hudi_smoke.sql
      docker cp database/contrib/datalake_fdw/automation/prepare/prepare_hudi/hudi_coverage.sql spark-master:/tmp/hudi_coverage.sql
      docker cp database/contrib/datalake_fdw/automation/prepare/prepare_s3/s3_smoke.sql hiveserver2:/tmp/s3_smoke.sql

      deadline=$(( $(date +%s) + 300 ))
      while true;do
        if  docker exec -i hiveserver2 /bin/bash -lc 'echo >/dev/tcp/hiveserver2/10000';then
          echo hiveserver started
          break
        fi
        if [ "$(date +%s)" -ge "${deadline}" ]; then
          echo "ERROR: timed out waiting for hiveserver2 after 300s" >&2
          exit 1
        fi
        echo waiting for hiveserver start...
        sleep 1
      done

      docker exec -i hiveserver2 /opt/hive/bin/beeline -u jdbc:hive2://hiveserver2:10000/default -n hive -e "CREATE DATABASE IF NOT EXISTS public;"
      docker exec -i hiveserver2 /opt/hive/bin/beeline -u jdbc:hive2://hiveserver2:10000/default -n hive -f /tmp/hdfs_smoke.sql
      docker exec -i hiveserver2 /opt/hive/bin/beeline -u jdbc:hive2://hiveserver2:10000/default -n hive -f /tmp/hive_smoke.sql || true
      docker exec -i hiveserver2 /opt/hive/bin/beeline -u jdbc:hive2://hiveserver2:10000/default -n hive -f /tmp/s3_smoke.sql

      docker exec -i spark-master /opt/spark/bin/spark-sql --master local[*] \
          --conf hive.stats.jdbc.timeout=10 \
        --conf spark.hadoop.fs.s3a.endpoint=http://minio:9000 \
        --conf spark.hadoop.fs.s3a.access.key=admin \
        --conf spark.hadoop.fs.s3a.secret.key=admin12345 \
        --conf spark.hadoop.fs.s3a.path.style.access=true \
        --conf spark.hadoop.fs.s3a.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider \
        --conf spark.serializer=org.apache.spark.serializer.KryoSerializer \
        --conf spark.sql.extensions=org.apache.spark.sql.hudi.HoodieSparkSessionExtension \
        --conf spark.sql.catalog.spark_catalog=org.apache.spark.sql.hudi.catalog.HoodieCatalog \
        --conf spark.hadoop.hive.metastore.uris=thrift://hive-metastore:9083 \
        --conf spark.hadoop.dfs.client.block.write.replace-datanode-on-failure.policy=NEVER \
        --conf spark.hadoop.dfs.client.block.write.replace-datanode-on-failure.enable=false \
        --conf spark.hadoop.dfs.replication=1 -f /tmp/hudi_smoke.sql

      docker exec -i spark-master /opt/spark/bin/spark-sql --master local[*] \
          --conf hive.stats.jdbc.timeout=10 \
        --conf spark.hadoop.fs.s3a.endpoint=http://minio:9000 \
        --conf spark.hadoop.fs.s3a.access.key=admin \
        --conf spark.hadoop.fs.s3a.secret.key=admin12345 \
        --conf spark.hadoop.fs.s3a.path.style.access=true \
        --conf spark.hadoop.fs.s3a.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider \
        --conf spark.serializer=org.apache.spark.serializer.KryoSerializer \
        --conf spark.sql.extensions=org.apache.spark.sql.hudi.HoodieSparkSessionExtension \
        --conf spark.sql.catalog.spark_catalog=org.apache.spark.sql.hudi.catalog.HoodieCatalog \
        --conf spark.hadoop.hive.metastore.uris=thrift://hive-metastore:9083 \
        --conf spark.hadoop.dfs.client.block.write.replace-datanode-on-failure.policy=NEVER \
        --conf spark.hadoop.dfs.client.block.write.replace-datanode-on-failure.enable=false \
        --conf spark.hadoop.dfs.replication=1 -f /tmp/hudi_coverage.sql


      docker exec -i spark-master /opt/spark/bin/spark-sql --master local[*] \
          --conf hive.stats.jdbc.timeout=10 \
        --conf spark.hadoop.hive.metastore.uris=thrift://hive-metastore:9083 \
        --conf spark.hadoop.fs.s3a.endpoint=http://minio:9000 \
        --conf spark.hadoop.fs.s3a.access.key=admin \
        --conf spark.hadoop.fs.s3a.secret.key=admin12345 \
        --conf spark.hadoop.fs.s3a.path.style.access=true \
        --conf spark.hadoop.fs.s3a.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider \
        --conf spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions \
        --conf spark.sql.catalog.ic=org.apache.iceberg.spark.SparkCatalog \
        --conf spark.sql.catalog.ic.type=hive \
        --conf spark.sql.catalog.ic.uri=thrift://hive-metastore:9083 -f /tmp/hive_iceberg_fdw.sql
    popd

    export ENV=release

    # The smoke Makefiles (notably smoke/s3/Makefile and smoke/iceberg_am_*)
    # invoke `mc` / `beeline` / `hdfs` to clean and seed minio + hiveserver2
    # before pg_regress runs.  Those binaries are not on the runner image,
    # so pre-populate the cache from the internal OBS mirror and let
    # check_services.sh's install_tools.sh extract them into tools/bin
    # (which run_smoke_tests.sh already prepends to PATH).
    bash database/contrib/datalake_fdw/automation/docker/singlecluster/download_cache/download.sh
    export INSTALL_TOOLS=1

    # make prepare-datalake-smoke
    make test-datalake-smoke

  after_script: |
    cd ${CI_PROJECT_DIR} && docker compose -f services/datalake-test-env.yml down -v || true
  rules:
    - !reference [ .common-rules ]
  artifacts:
    <<: *artifacts

test_datalake_rest_catalog_smoke:
  stage: test
  extends: .common
  <<: *cache-only-pull
  script: |
    trap 'test -e /tmp/.debugging && tmux new-session -d -s debug && tmux wait-for done' EXIT

    env
    set -euxo pipefail

    # Smoke test for the datalake_rest_catalog REST gateway (issue #382): bring up
    # MinIO + a single-node cluster, write a builtin Iceberg table (sales.orders),
    # start the gateway, and prove an unmodified external client (latest PyIceberg,
    # over the gateway's default HTTPS on :8443) reads the 3 seeded rows back.
    # Thin CI wrapper over the committed e2e assets; no new test logic.
    #
    # The cluster/gateway/seed/read section runs as the non-root 'gpadmin' user because
    # gpinitsystem / gpstart / gpstop refuse to run as root (this CI runner is root).
    export ENV=release
    DB="${CI_PROJECT_DIR}/database"
    DRC="${DB}/contrib/datalake_rest_catalog"
    MINIO_IMG=docker.hashdata.dev/minio/minio:latest
    MC_IMG=docker.hashdata.dev/minio/mc:latest

    # --- 1. MinIO on localhost:9000, bucket 'warehouse' (matches seed_builtin.sql) [root] ---
    docker rm -f drc-smoke-minio >/dev/null 2>&1 || true
    docker run -d --name drc-smoke-minio -p 9000:9000 \
      -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
      "${MINIO_IMG}" server /data
    for i in $(seq 1 30); do
      curl -sf http://localhost:9000/minio/health/live >/dev/null 2>&1 && break || sleep 1
    done
    docker run --rm --network host --entrypoint sh "${MC_IMG}" -c \
      "mc alias set l http://localhost:9000 minioadmin minioadmin && mc mb -p l/warehouse"

    # --- 2. Product env; locate the gateway jar (built by the pipeline because the build config
    #        enables --enable-datalake-rest-catalog). The read section below fails fast if it is
    #        absent (e.g. build_develop didn't run) rather than trying to build it on this runner,
    #        which has no Maven.
    . "${CI_PROJECT_DIR}/dist/database/cloudberry-env.sh"
    JARDIR="$(pg_config --pkglibdir)/java"

    # --- 3. Hand the cluster/gateway/seed/read off to gpadmin (non-root) --------------------
    mkdir -p /home/gpadmin && chown gpadmin:gpadmin /home/gpadmin
    chown -R gpadmin:gpadmin "${DB}/gpAux/gpdemo"
    # gpinitsystem/gpstart PING_HOST use ping for host-reachability, but the k8s CI pod lacks
    # CAP_NET_RAW so non-root ping fails ("socket: Operation not permitted"). Shim ping/ping6 to
    # exit 0 (PING_HOST only checks the exit code; the single-host demo is trivially reachable).
    mkdir -p /tmp/drc-shim
    printf '#!/bin/sh\nexit 0\n' > /tmp/drc-shim/ping
    cp /tmp/drc-shim/ping /tmp/drc-shim/ping6
    chmod 755 /tmp/drc-shim/ping /tmp/drc-shim/ping6
    cat > /tmp/drc_smoke_body.sh <<'BODY'
    set -euxo pipefail
    export ENV=release
    export DRC_JAVA_HOME=/opt/jdk17
    export PATH="/tmp/drc-shim:/opt/jdk17/bin:${PATH}"
    DB="${CI_PROJECT_DIR}/database"
    DRC="${DB}/contrib/datalake_rest_catalog"
    . "${CI_PROJECT_DIR}/dist/database/cloudberry-env.sh"

    # 3a. single-node demo cluster (coordinator on default PORT_BASE=7000)
    make -C "${DB}" create-demo-cluster
    . "${DB}/gpAux/gpdemo/gpdemo-env.sh"
    # gateway reads pg.jdbcUrl; point it at the actual coordinator port (don't assume 7000).
    export PG_JDBCURL="jdbc:postgresql://localhost:${PGPORT}/postgres?ssl=false"

    # 4. hardening: reader role -> authenticator -> scram pg_hba (order matters).
    #    create_authenticator.sql GRANTs iceberg_reader (so it must exist first);
    #    rest_catalog_authz.sql (bundled in the seed) RAISEs unless iceberg_authenticator
    #    exists. PGOPTIONS forces scram-sha-256 verifiers for the scram pg_hba lines.
    AUTH_PW="drc_auth_${CI_PIPELINE_ID:-0}"
    SCRAM="PGOPTIONS=-c password_encryption=scram-sha-256"
    env "${SCRAM}" psql -p "${PGPORT}" -v ON_ERROR_STOP=1 postgres \
      -c "CREATE ROLE iceberg_reader LOGIN PASSWORD 'reader_pw';"
    env "${SCRAM}" psql -p "${PGPORT}" -v ON_ERROR_STOP=1 postgres \
      -v pw="${AUTH_PW}" -f "${DRC}/security/create_authenticator.sql"
    # pg_hba is first-match-wins -> prepend the scram fragment above the demo's trust lines.
    HBA="${COORDINATOR_DATA_DIRECTORY:-${MASTER_DATA_DIRECTORY}}/pg_hba.conf"
    cat "${DRC}/security/pg_hba.rest_catalog.fragment" "${HBA}" > "${HBA}.drc" && mv "${HBA}.drc" "${HBA}"
    gpstop -u

    # 5. write the builtin Iceberg table: sales.orders (3 rows) + authz layer.
    #    (The gateway itself is started by the main script below, inside the JDK-bearing
    #    engine-tester image -- this CI runner has no JDK17, and gpinit/psql above don't need one.)
    export S3_ACCESS_KEY_ID=minioadmin S3_SECRET_ACCESS_KEY=minioadmin
    env "${SCRAM}" psql -p "${PGPORT}" -v ON_ERROR_STOP=1 -d postgres \
      -v authz_sql="${DRC}/security/rest_catalog_authz.sql" \
      -f "${DRC}/e2e/seed_builtin.sql"

    # 6. cluster + hardening + seed are up; the gateway + four-engine read run after this
    #    body returns (main script), in the engine-tester container over --network host.
    echo "drc_smoke_body: cluster + hardening + seed ready on :${PGPORT} (gateway starts next)"
    BODY
    chown gpadmin:gpadmin /tmp/drc_smoke_body.sh
    runuser -u gpadmin -- env HOME=/home/gpadmin \
      CI_PROJECT_DIR="${CI_PROJECT_DIR}" CI_PIPELINE_ID="${CI_PIPELINE_ID:-0}" \
      bash /tmp/drc_smoke_body.sh

    # --- 4. gateway + four-engine read, inside the engine-tester image ----------------------
    # This CI runner has no JDK, so the Java gateway runs INSIDE the tester image (which has one),
    # and so do the four Iceberg clients. This runner's docker daemon can't see the job pod's
    # filesystem, so bind mounts of job paths don't work (MinIO above only used -p/--network host);
    # we `docker cp` the jar + e2e assets into the container instead. --network host lets the
    # gateway reach PG:${PGPORT} + MinIO:9000 on the runner and serve HTTPS :8443. Override the
    # image with the ENGINE_TESTER_IMAGE CI/CD variable; unset falls back to the current tag,
    # explicit-empty forces the skip path below.
    ENGINE_TESTER_IMAGE="${ENGINE_TESTER_IMAGE-docker.hashdata.dev/hashdata-releng/datalake-test:rest-test-20260714}"
    if [ -z "${ENGINE_TESTER_IMAGE}" ]; then
      echo "ENGINE_TESTER_IMAGE empty: runner has no JDK to run the gateway and no engine runtimes;"
      echo "nothing to validate -- set ENGINE_TESTER_IMAGE to the tester image. Skipping."
      exit 0
    fi
    # A missing image would otherwise surface as a cryptic `docker create ... manifest not found`.
    # Turn it into the documented graceful skip so the job stays green until the image is pushed.
    if ! docker image inspect "${ENGINE_TESTER_IMAGE}" >/dev/null 2>&1 \
       && ! docker pull "${ENGINE_TESTER_IMAGE}" >/dev/null 2>&1; then
      echo "engine-tester image ${ENGINE_TESTER_IMAGE} not available in the registry;"
      echo "skipping smoke -- push the image or set ENGINE_TESTER_IMAGE to an available one."
      exit 0
    fi

    GW_JAR="${JARDIR}/datalake-rest-catalog-1.0.0.jar"
    [ -f "${GW_JAR}" ] || { echo "ERROR: gateway jar not found at ${GW_JAR} (build cache missing it?)"; exit 1; }
    . "${DB}/gpAux/gpdemo/gpdemo-env.sh" 2>/dev/null || true
    PGPORT="${PGPORT:-7000}"
    AUTH_PW="drc_auth_${CI_PIPELINE_ID:-0}"

    # 4a. gateway: create -> cp jar in -> start, so the jar is present before `java -jar` runs.
    #     Foreground java => container lifetime == gateway. --entrypoint java resolves java on
    #     PATH (system JDK or /opt/jdk17). Same env contract as ctl.sh (S3 creds, authenticator
    #     password, JDBC url). HTTPS self-signed cert on :8443 generated at startup.
    docker rm -f drc-gateway >/dev/null 2>&1 || true
    docker create --name drc-gateway --network host \
      -e S3_ACCESS_KEY_ID=minioadmin -e S3_SECRET_ACCESS_KEY=minioadmin \
      -e PG_AUTHENTICATOR_PASSWORD="${AUTH_PW}" \
      -e PG_JDBCURL="jdbc:postgresql://localhost:${PGPORT}/postgres?ssl=false" \
      --entrypoint java "${ENGINE_TESTER_IMAGE}" -jar /tmp/drc-gateway.jar
    docker cp "${GW_JAR}" drc-gateway:/tmp/drc-gateway.jar
    docker start drc-gateway
    echo "waiting for gateway :8443 ..."
    gw_ok=""
    for i in $(seq 1 60); do
      curl -sfk https://localhost:8443/v1/config >/dev/null 2>&1 && { gw_ok=1; break; }
      docker ps -q -f name=drc-gateway -f status=running | grep -q . \
        || { echo "gateway container exited early; log:"; docker logs --tail 60 drc-gateway 2>&1 || true; break; }
      sleep 2
    done
    [ -n "${gw_ok}" ] || { echo "ERROR: gateway not ready on :8443; log:"; docker logs --tail 80 drc-gateway 2>&1 || true; exit 1; }
    echo "gateway up on :8443"

    # 4b. four-engine read: cp the e2e assets into the SAME container and exec run_engines.sh there
    #     (reaches the gateway on localhost:8443 + MinIO on :9000 in the shared netns).
    docker cp "${DRC}/e2e" drc-gateway:/drc-e2e
    docker exec \
      -e http_proxy -e https_proxy -e no_proxy -e HTTP_PROXY -e HTTPS_PROXY -e NO_PROXY \
      drc-gateway bash /drc-e2e/smoke/run_engines.sh pyiceberg spark trino duckdb
  after_script: |
    # Stop the gateway container; the reads ran in a --rm container (self-cleaning).
    docker rm -f drc-gateway >/dev/null 2>&1 || true
    # Teardown also runs as gpadmin (gpstop/destroy-demo-cluster refuse root); MinIO is root.
    runuser -u gpadmin -- env HOME=/home/gpadmin CI_PROJECT_DIR="${CI_PROJECT_DIR}" \
      DRC_JAVA_HOME=/opt/jdk17 bash -c '
        export PATH="/tmp/drc-shim:${PATH}";
        DRC="${CI_PROJECT_DIR}/database/contrib/datalake_rest_catalog";
        "${DRC}/bin/datalake_rest_catalog_ctl.sh" stop || true;
        . "${CI_PROJECT_DIR}/dist/database/cloudberry-env.sh" 2>/dev/null || true;
        make -C "${CI_PROJECT_DIR}/database" destroy-demo-cluster || true' || true
    docker rm -f drc-smoke-minio || true
  rules:
    - !reference [ .common-rules ]
  artifacts:
    <<: *artifacts

test_datalake_feature:
  stage: test
  extends: .common
  <<: *cache-only-pull
  script: |
    trap 'test -e /tmp/.debugging && tmux new-session -d -s debug && tmux wait-for done' EXIT

    set -euxo pipefail
    pushd ${CI_PROJECT_DIR}
      docker network create share-enterprise-ci || true
      docker compose -f services/datalake-test-env.yml up -d
      docker cp database/contrib/datalake_fdw/automation/prepare/prepare_hive/hive_iceberg_fdw.sql spark-master:/tmp/
      docker cp database/contrib/datalake_fdw/automation/prepare/prepare_hive/hive_smoke.sql hiveserver2:/tmp/
      docker cp database/contrib/datalake_fdw/automation/prepare/prepare_hdfs/hdfs_smoke.sql hiveserver2:/tmp/
      # Hudi prep must run the same hudi version the datalake_fdw reader and
      # the committed expected files are calibrated against (0.13.1).  The
      # spark image ships hudi-spark3.3-bundle 0.14.1, whose shaded hbase is
      # ABI-incompatible with the image's hadoop-client 3.3.2: writes crash at
      # commit time with NoSuchMethodError: HdfsDataInputStream
      # .getReadStatistics() while closing metadata-table HFile readers
      # (pipeline #139668).  Swap the bundle inside the freshly composed
      # container before running any hudi SQL.
      HUDI_BUNDLE=hudi-spark3.3-bundle_2.12-0.13.1.jar
      curl -fsSL -o /tmp/${HUDI_BUNDLE} "https://hashdata-download.obs.cn-north-4.myhuaweicloud.com/lightning-ci/packages/${HUDI_BUNDLE}"
      docker exec spark-master bash -c 'rm -f /opt/spark/jars/hudi-spark3*-bundle_*.jar'
      docker cp /tmp/${HUDI_BUNDLE} spark-master:/opt/spark/jars/${HUDI_BUNDLE}

      docker cp database/contrib/datalake_fdw/automation/prepare/prepare_hudi/hudi_smoke.sql spark-master:/tmp/hudi_smoke.sql
      docker cp database/contrib/datalake_fdw/automation/prepare/prepare_hudi/hudi_coverage.sql spark-master:/tmp/hudi_coverage.sql
      docker cp database/contrib/datalake_fdw/automation/prepare/prepare_s3/s3_smoke.sql hiveserver2:/tmp/s3_smoke.sql


      deadline=$(( $(date +%s) + 300 ))
      while true;do
        if  docker exec -i hiveserver2 /bin/bash -lc 'echo >/dev/tcp/hiveserver2/10000';then
          echo hiveserver started
          break
        fi
        if [ "$(date +%s)" -ge "${deadline}" ]; then
          echo "ERROR: timed out waiting for hiveserver2 after 300s" >&2
          exit 1
        fi
        echo waiting for hiveserver start...
        sleep 1
      done

      docker exec -i hiveserver2 /opt/hive/bin/beeline -u jdbc:hive2://hiveserver2:10000/default -n hive -e "CREATE DATABASE IF NOT EXISTS public;"
      docker exec -i hiveserver2 /opt/hive/bin/beeline -u jdbc:hive2://hiveserver2:10000/default -n hive -f /tmp/hdfs_smoke.sql
      docker exec -i hiveserver2 /opt/hive/bin/beeline -u jdbc:hive2://hiveserver2:10000/default -n hive -f /tmp/hive_smoke.sql || true
      docker exec -i hiveserver2 /opt/hive/bin/beeline -u jdbc:hive2://hiveserver2:10000/default -n hive -f /tmp/s3_smoke.sql

      docker exec -i spark-master /opt/spark/bin/spark-sql --master local[*] \
          --conf hive.stats.jdbc.timeout=10 \
        --conf spark.hadoop.fs.s3a.endpoint=http://minio:9000 \
        --conf spark.hadoop.fs.s3a.access.key=admin \
        --conf spark.hadoop.fs.s3a.secret.key=admin12345 \
        --conf spark.hadoop.fs.s3a.path.style.access=true \
        --conf spark.hadoop.fs.s3a.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider \
        --conf spark.serializer=org.apache.spark.serializer.KryoSerializer \
        --conf spark.sql.extensions=org.apache.spark.sql.hudi.HoodieSparkSessionExtension \
        --conf spark.sql.catalog.spark_catalog=org.apache.spark.sql.hudi.catalog.HoodieCatalog \
        --conf spark.hadoop.hive.metastore.uris=thrift://hive-metastore:9083 \
        --conf spark.hadoop.dfs.client.block.write.replace-datanode-on-failure.policy=NEVER \
        --conf spark.hadoop.dfs.client.block.write.replace-datanode-on-failure.enable=false \
        --conf spark.hadoop.dfs.replication=1 -f /tmp/hudi_smoke.sql

      docker exec -i spark-master /opt/spark/bin/spark-sql --master local[*] \
          --conf hive.stats.jdbc.timeout=10 \
        --conf spark.hadoop.fs.s3a.endpoint=http://minio:9000 \
        --conf spark.hadoop.fs.s3a.access.key=admin \
        --conf spark.hadoop.fs.s3a.secret.key=admin12345 \
        --conf spark.hadoop.fs.s3a.path.style.access=true \
        --conf spark.hadoop.fs.s3a.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider \
        --conf spark.serializer=org.apache.spark.serializer.KryoSerializer \
        --conf spark.sql.extensions=org.apache.spark.sql.hudi.HoodieSparkSessionExtension \
        --conf spark.sql.catalog.spark_catalog=org.apache.spark.sql.hudi.catalog.HoodieCatalog \
        --conf spark.hadoop.hive.metastore.uris=thrift://hive-metastore:9083 \
        --conf spark.hadoop.dfs.client.block.write.replace-datanode-on-failure.policy=NEVER \
        --conf spark.hadoop.dfs.client.block.write.replace-datanode-on-failure.enable=false \
        --conf spark.hadoop.dfs.replication=1 -f /tmp/hudi_coverage.sql


      docker exec -i spark-master /opt/spark/bin/spark-sql --master local[*] \
          --conf hive.stats.jdbc.timeout=10 \
        --conf spark.hadoop.hive.metastore.uris=thrift://hive-metastore:9083 \
        --conf spark.hadoop.fs.s3a.endpoint=http://minio:9000 \
        --conf spark.hadoop.fs.s3a.access.key=admin \
        --conf spark.hadoop.fs.s3a.secret.key=admin12345 \
        --conf spark.hadoop.fs.s3a.path.style.access=true \
        --conf spark.hadoop.fs.s3a.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider \
        --conf spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions \
        --conf spark.sql.catalog.ic=org.apache.iceberg.spark.SparkCatalog \
        --conf spark.sql.catalog.ic.type=hive \
        --conf spark.sql.catalog.ic.uri=thrift://hive-metastore:9083 -f /tmp/hive_iceberg_fdw.sql
    popd

    export ENV=release

    # The feature test Makefiles invoke `mc` / `beeline` / `hdfs` to clean
    # and seed minio + hiveserver2 before pg_regress runs.  Those binaries
    # are not on the runner image, so pre-populate the cache from the
    # internal OBS mirror and let check_services.sh's install_tools.sh
    # extract them into tools/bin (run_smoke_tests.sh already prepends to PATH).
    bash database/contrib/datalake_fdw/automation/docker/singlecluster/download_cache/download.sh
    export INSTALL_TOOLS=1

    # make prepare-datalake-smoke
    make test-datalake-feature

  after_script: |
    cd ${CI_PROJECT_DIR} && docker compose -f services/datalake-test-env.yml down -v || true
  rules:
    - !reference [ .common-rules ]
  artifacts:
    <<: *artifacts
